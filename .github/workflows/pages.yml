name: Refresh Rainline City data

on:
  workflow_dispatch:
  schedule:
    - cron: "8,38 * * * *"

permissions:
  contents: write
  pages: write

concurrency:
  group: rainline-live-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: windows-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository without marketplace actions
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git config --global --add safe.directory "$PWD"
          git remote add origin "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin main
          git checkout --force FETCH_HEAD
          git switch -C main

      - name: Generate live data
        shell: pwsh
        run: |
          ./Update-LiveData.ps1 -IntervalSeconds 1800 -RequestTimeoutSeconds 20 -NoRetryOnFailure -OutFile "$PWD/live-data.js"

      - name: Normalize refresh metadata
        shell: pwsh
        run: |
          $path = Join-Path $PWD "live-data.js"
          $content = Get-Content -Raw $path
          $match = [regex]::Match($content, "window\.RAINLINE_DATA\s*=\s*(.*?);\s*window\.dispatchEvent", [System.Text.RegularExpressions.RegexOptions]::Singleline)
          if (-not $match.Success) {
            throw "Could not find RAINLINE_DATA payload in live-data.js"
          }
          $payload = $match.Groups[1].Value | ConvertFrom-Json
          $generatedAt = [datetimeoffset]::Parse($payload.generatedAt)
          $payload.refreshIntervalSeconds = 1800
          $payload.nextRefreshAt = $generatedAt.AddSeconds(1800).ToString("o")
          $json = $payload | ConvertTo-Json -Depth 20 -Compress
          $js = "window.RAINLINE_DATA = $json;`nwindow.dispatchEvent(new CustomEvent('rainline-data-updated', { detail: window.RAINLINE_DATA }));`n"
          [System.IO.File]::WriteAllText($path, $js, [System.Text.UTF8Encoding]::new($false))

      - name: Validate publishable data
        shell: pwsh
        run: |
          $path = Join-Path $PWD "live-data.js"
          $content = Get-Content -Raw $path
          $match = [regex]::Match($content, "window\.RAINLINE_DATA\s*=\s*(.*?);\s*window\.dispatchEvent", [System.Text.RegularExpressions.RegexOptions]::Singleline)
          if (-not $match.Success) {
            throw "Could not validate RAINLINE_DATA payload in live-data.js"
          }

          $payload = $match.Groups[1].Value | ConvertFrom-Json
          $errors = @($payload.errors)
          if ($null -eq $payload.transpower -or $null -eq $payload.rnz -or $errors.Count -ge 3) {
            $detail = if ($errors.Count) { $errors -join " | " } else { "Core feed data is missing." }
            throw "Generated data is incomplete; keeping the previous published data. $detail"
          }

      - name: Commit refreshed data
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if (-not (git status --porcelain -- live-data.js)) {
            Write-Host "live-data.js is unchanged."
            exit 0
          }

          git add live-data.js
          git commit -m "Refresh live data"

          $delay = 10
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) {
              break
            }

            if ($attempt -eq 5) {
              throw "Could not push refreshed live-data.js after $attempt attempts."
            }

            Write-Warning "Push failed; rebasing and trying again in ${delay}s."
            Start-Sleep -Seconds $delay
            git fetch --depth=1 origin main
            git rebase origin/main
            $delay = [Math]::Min($delay * 2, 60)
          }

      - name: Request GitHub Pages rebuild
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $output = gh api -X POST "repos/$env:GITHUB_REPOSITORY/pages/builds" 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Could not request a Pages rebuild explicitly. Branch publishing should still rebuild from the pushed commit. $output"
          } else {
            Write-Host $output
          }
