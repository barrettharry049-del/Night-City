name: Update and publish Rainline City

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "index-tv.html"
      - "style.css"
      - "footer-tweaks.css"
      - "wallpaper.js"
      - "wallpaper-legacy.js"
      - "wallpaper-normal-tweaks.js"
      - "footer-data-age-legacy.js"
      - "refresh-guard.js"
      - "live-data.js"
      - "Update-LiveData.ps1"
      - ".github/workflows/**"
  workflow_dispatch:
  schedule:
    - cron: "2-59/6 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: --no-deprecation

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 16

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Generate live data
        shell: pwsh
        run: |
          ./Update-LiveData.ps1 -IntervalSeconds 360 -NoRetryOnFailure -OutFile "$PWD/live-data.js"

      - name: Normalize refresh metadata
        shell: pwsh
        run: |
          $path = Join-Path $PWD "live-data.js"
          $content = Get-Content -Raw $path
          $match = [regex]::Match($content, "window\.RAINLINE_DATA\s*=\s*(.*?);\s*window\.dispatchEvent", [System.Text.RegularExpressions.RegexOptions]::Singleline)
          if (-not $match.Success) {
            throw "Could not find RAINLINE_DATA payload in live-data.js"
          }
          $payload = $match.Groups[1].Value | ConvertFrom-Json
          $generatedAt = [datetimeoffset]::Parse($payload.generatedAt)
          $payload.refreshIntervalSeconds = 360
          $payload.nextRefreshAt = $generatedAt.AddSeconds(360).ToString("o")
          $json = $payload | ConvertTo-Json -Depth 20 -Compress
          $js = "window.RAINLINE_DATA = $json;`nwindow.dispatchEvent(new CustomEvent('rainline-data-updated', { detail: window.RAINLINE_DATA }));`n"
          [System.IO.File]::WriteAllText($path, $js, [System.Text.UTF8Encoding]::new($false))

      - name: Validate publishable data
        shell: pwsh
        run: |
          $path = Join-Path $PWD "live-data.js"
          $content = Get-Content -Raw $path
          $match = [regex]::Match($content, "window\.RAINLINE_DATA\s*=\s*(.*?);\s*window\.dispatchEvent", [System.Text.RegularExpressions.RegexOptions]::Singleline)
          if (-not $match.Success) {
            throw "Could not validate RAINLINE_DATA payload in live-data.js"
          }

          $payload = $match.Groups[1].Value | ConvertFrom-Json
          $errors = @($payload.errors)
          if ($null -eq $payload.transpower -or $null -eq $payload.rnz -or $errors.Count -ge 3) {
            $detail = if ($errors.Count) { $errors -join " | " } else { "Core feed data is missing." }
            throw "Generated data is incomplete; keeping the previous working Pages deployment. $detail"
          }

      - name: Configure GitHub Pages
        id: configure_pages_1
        continue-on-error: true
        uses: actions/configure-pages@v6

      - name: Wait before Pages configure retry
        if: steps.configure_pages_1.outcome == 'failure'
        shell: pwsh
        run: Start-Sleep -Seconds 30

      - name: Configure GitHub Pages retry
        if: steps.configure_pages_1.outcome == 'failure'
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deploy_pages_1
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before Pages deploy retry
        if: steps.deploy_pages_1.outcome == 'failure'
        shell: pwsh
        run: Start-Sleep -Seconds 60

      - name: Deploy to GitHub Pages retry
        id: deploy_pages_2
        if: steps.deploy_pages_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before final Pages deploy retry
        if: steps.deploy_pages_1.outcome == 'failure' && steps.deploy_pages_2.outcome == 'failure'
        shell: pwsh
        run: Start-Sleep -Seconds 120

      - name: Deploy to GitHub Pages final retry
        if: steps.deploy_pages_1.outcome == 'failure' && steps.deploy_pages_2.outcome == 'failure'
        uses: actions/deploy-pages@v5
