name: Backup Rainline City refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "7-59/10 * * * *"

permissions:
  actions: write
  contents: read

jobs:
  check-and-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Dispatch refresh when publishing is stale
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          retry_gh() {
            attempt=1
            delay=15

            while true; do
              output="$("$@" 2>&1)"
              status=$?
              if [ "$status" -eq 0 ]; then
                printf '%s\n' "$output"
                return 0
              fi

              printf 'Attempt %s failed: %s\n' "$attempt" "$output" >&2
              if [ "$attempt" -ge 5 ]; then
                return "$status"
              fi

              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
              if [ "$delay" -gt 120 ]; then
                delay=120
              fi
            done
          }

          latest="$(retry_gh gh run list --repo "$GITHUB_REPOSITORY" --workflow pages.yml --status success --limit 1 --json createdAt --jq '.[0].createdAt // ""')"
          if [ -z "$latest" ]; then
            echo "No successful publish found; dispatching refresh."
            retry_gh gh workflow run pages.yml --repo "$GITHUB_REPOSITORY"
            exit 0
          fi

          age_seconds=$(( $(date -u +%s) - $(date -u -d "$latest" +%s) ))
          echo "Latest successful publish age: ${age_seconds}s"
          if [ "$age_seconds" -ge 1800 ]; then
            retry_gh gh workflow run pages.yml --repo "$GITHUB_REPOSITORY"
          else
            echo "Recent publish found; backup refresh is not needed."
          fi
